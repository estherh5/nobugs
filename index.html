<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="description" content="NoBugs! is a family-owned pest control supply store in Philadelphia, PA.">
    <meta name="keywords" content="pest control supplies in Philadelphia,pest control supplies in Northern Liberties,do it yourself pest control,DIY pest control,extermination equipment">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts, Bootstrap, and CSS stylesheets -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Abel">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.6/css/bootstrap.min.css" integrity="sha384-rwoIResjU2yc3z8GV/NPeZWAv56rSmLldC3R/AZzGRnGxQQKnKkoFVhFQhNUwEyJ" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <title>NoBugs! Pest Control Supplies</title>
  </head>
  <body class="homepage">

    <!-- Main page container -->
    <main class="container-fluid align-items-center d-flex justify-content-center">
      <div id="main-row" class="row no-gutters align-items-center justify-content-center">
        <div class="col">

          <!-- Company logo with link to Products page -->
          <div class="row no-gutters">
            <div class="col">
              <a href="products/" class="d-flex flex-column align-items-center justify-content-center">
                <img id="logo-big" src="images/logo.png" alt="NoBugs!" title="NoBugs!">
              </a>
            </div>
          </div>

          <!-- Company description -->
          <div class="row no-gutters">
            <div class="col">
              <h1 class="homepage">pest control supplies</h1>
            </div>
          </div>

          <!-- Navigation links -->
          <div class="row my-1 no-gutters justify-content-center">
            <div class="col-auto">
              <a class="homepage" href="products/">PRODUCTS</a>
            </div>
            <div class="col-auto">
              <a class="homepage" href="security/">SECURITY</a>
            </div>
            <div class="col-auto">
              <a class="homepage" href="seminars/">SEMINARS</a>
            </div>
            <div class="col-auto">
              <a class="homepage" href="history/">HISTORY</a>
            </div>
            <div class="col-auto">
              <a class="homepage" href="contact/">CONTACT</a>
            </div>
          </div>

          <!-- Contact information -->
          <div class="row no-gutters">
            <div class="col">
              <h2 class="homepage">
                <a href="tel:12155927997">(215) 592-7997</a> | <a href="contact/">545 North Orianna Street, Philadelphia, PA</a>
              </h2>
            </div>
          </div>

          <!-- Mailing list sign-up -->
          <div class="row pt-10 no-gutters d-flex flex-column">
            <form id="signup" class="col d-flex flex-row align-items-center justify-content-center flex-1" novalidate>
              <input id="email-input" type="email" name="email" autocomplete="email" placeholder="Email address" aria-label="Email address">
              <button id="submit" type="submit">Join Our Mailing List</button>
            </form>
            <div id="signup-status" role="status">
              <div id="invalid-error">Please enter a valid email address.</div>
              <div id="server-error">Your email could not be added right now. <button id="retry" type="button">Try again</button></div>
              <div id="already">You are already on our mailing list!</div>
              <div id="success">Thanks for signing up!</div>
            </div>
          </div>

        </div>
      </div>
    </main>

    <!-- Main JS script -->
    <script src="main.js"></script>

  </body>
</html>
